interface:
  display_name: "Agent Deep Links"
  short_description: "Build and verify app deep links for Slack and handoffs."
  default_prompt: "Create or validate deep links for Codex/Cursor/VS Code and provide fallbacks for unsupported apps."
  # Personal note: also useful for Windsurf and Zed editor deep links
  # Personal note: Zed deep link format is zed://file/{path}:{line}
  fallback_behavior: "copy_to_clipboard"  # default was silent fail; copy link instead
  fallback_notify: true  # show a toast/notification when fallback is triggered
